# Rime dictionary
# encoding: utf-8
#
# rime配置的部署位置：
# ~/.local/share/fcitx5/rime 或者 ~/.config/ibus/rime  (Linux)
# ~/Library/Rime  (Mac OS)
# %APPDATA%\Rime  (Windows)
#
#

---
name: custom_dict
version: "LTS"
sort: by_weight  #字典初始排序，可選original或by_weight
use_preset_vocabulary: false
import_tables:
  - my_dicts/common
  - my_dicts/cantonese
  - my_dicts/cantonese_ext
  - my_dicts/f1
...
