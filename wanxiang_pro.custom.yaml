# 本文件的工作目录是在用户根目录，本目录携带是因为如果放外面就会更新的时候覆盖你的修改，因此我只能藏起来。
# 如果没有按初始化说明进行初始化那么你需要手动复制本文件到上层目录，请知悉。
patch:
  speller/algebra:
    __patch:
      #- wanxiang_algebra:/模糊音_nl
      #- wanxiang_algebra:/模糊音_ry
      #- wanxiang_algebra:/模糊音_hf
      #- wanxiang_algebra:/模糊音_rl
      #- wanxiang_algebra:/模糊音_kg
      #- wanxiang_algebra:/模糊音_en_eng
      #- wanxiang_algebra:/模糊音_in_ing
      #- wanxiang_algebra:/模糊音_c_ch
      #- wanxiang_algebra:/模糊音_z_zh
      #- wanxiang_algebra:/模糊音_s_sh
      - wanxiang_algebra:/pro/自然码
      # 可选输入方案名称：自然码, 自然龙, 小鹤双拼, 搜狗双拼, 微软双拼, 智能ABC, 紫光双拼, 国标双拼
      - wanxiang_algebra:/pro/直接辅助
      #辅助码升级为：直接辅助和间接辅助两种类型，都是句中任意，不同点在于直接辅助是nire=你  而间接则需要/引导  ni/re=你 ，在这个基础上直接辅助支持拼音后任意位置数字声调参与，间接辅助声调在/引导前参与
      #- wanxiang_algebra:/自然码提权             #自然码提权、小鹤双拼提权 可选
      - wanxiang_algebra:/26jian
      #- wanxiang_algebra:/18jian
      #- wanxiang_algebra:/14jian

  #下面是候选数量
  menu/page_size: 6

  #自己指定挂载的词库
  translator/packs/+:
    - custom_dict

  #这个文件主要用于置顶，编码为自定义编码的词汇，取消注释用自己的词库名称避免覆盖，须与wanxiang_phrase.custom.yaml一同修改
  #custom_phrase/dictionary: wanxiang_phrase_my
  #这个文件主要用于自定义简码词汇，取消注释用自己的词库名称避免覆盖，须与wanxiang_abbrev.custom.yaml一同修改
  #abbrev_phrase/dictionary: wanxiang_abbrev_my

  switches:
    - name: ascii_mode  # 中英输入状态
      states: [中文, 英文]
    - name: ascii_punct  # 中英标点
      states: [中标, 英标]
    - name: full_shape  #全角、半角字符输出
      states: [半角, 全角]
    - name: emoji  #候选出现emoji滤镜，会显示在相应的候选后面，万象侧重于tips提示，避免候选被占用，因此默认为reset: 0，归属opencc emoji滤镜
      states: [表情关, 表情开]
    - name: chinese_english  #候选进入翻译模式滤镜，会显示在相应的候选后面，万象侧重于tips提示，避免候选被占用，快捷键配套ctrl+e,归属opencc 翻译滤镜
      states: [翻译关, 翻译开]
    - name: chaifen_switch  #开启后在候选的注释里面实时显示辅助码的拆分提醒优先级高于普通辅助提醒，不开启则采用系统配置，快捷键配套ctrl+c,影响的是comment_format，归属：super_comment.lua
      states: [拆分关, 拆分开]
    - name: charset_filter  #字符集过滤，默认开启8105通规显示，即小字集，可通过开关实时开启全字集，快捷键配套ctrl+g,归属：super_filter.lua
      states: [大字集, 小字集]
    - name: super_tips  #开启后在输入编码后面的提示区显示实时的提示数据，受tips数据库影响，表情、翻译、车牌、符号等对应关系数据，并可实现句号上屏，不开启则默认，影响的是segment.prompt参数，归属：super_tips.lua
      states: [提示关, 提示开]
    - name: context_reorder
      states: [上下文关, 上下文开]  # 上下文调频开关
    - options: [raw_input, tone_display, full_pinyin]  #开启后在输入编码的位置实时转换为带声调全拼或者不带声调全拼，不开启则采用系统配置原始编码，影响的是preedit_format,归属：super_preedit.lua
      states: [原编码, 有声调, 无声调]
      #reset: 1     #对于开关组从0开始数，第几个就reset几可设为默认
    - options: [comment_off, fuzhu_hint, tone_hint]  #开启后在候选的注释里面实时显示辅助码或者全拼声调，不开启则采用系统配置，影响的是comment_format，快捷键配套ctrl+a,归属：super_comment.lua
      states: [注释关, 辅助开, 读音开]
      reset: 1
    - options: [s2s, s2t, s2hk, s2tw]  # 简繁转换开关组，可以在一个空选项和多个实际“- simplifier@s2hk”引入的项目之前切换，这是一个开关组，你可以将其中任意一个s2s等设置为toggle快捷键，多次按下将轮询
      states: [简体, 通繁, 港繁, 臺繁]
    - name: abbrev
      states: [简码关, 简码开]
    - name: char_priority  #多体现在编码重合但候选有单字或者多字的情况`引导的辅码查词时是否单字优先，全拼常见，类似于特定编码情况下、反查状态下的调序能力。归属：super_lookup.lua
      states: [词组先, 单字先]
    - name: english
      states: [英文关, 英文开]
      reset: 1